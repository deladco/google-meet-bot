<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Daryna's AI Meetings Assistant logo">
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B2F3A"/>
      <stop offset="1" stop-color="#1D2028"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8B923"/>
      <stop offset="1" stop-color="#A87800"/>
    </linearGradient>
    <filter id="raise" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="14" dy="14" stdDeviation="14" flood-color="#0A0B0F" flood-opacity="0.85"/>
      <feDropShadow dx="-10" dy="-10" stdDeviation="12" flood-color="#3A3F4D" flood-opacity="0.55"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="56" y="56" width="400" height="400" rx="112" fill="url(#face)" filter="url(#raise)"/>
  <path d="M146 176 a30 30 0 0 1 30 -30 h160 a30 30 0 0 1 30 30 v100 a30 30 0 0 1 -30 30 h-96 l-48 44 v-44 h-16 a30 30 0 0 1 -30 -30 z" fill="#171A20" stroke="#12141A" stroke-width="3"/>
  <g fill="url(#gold)" filter="url(#glow)">
    <rect x="186" y="214" width="20" height="38" rx="10"/>
    <rect x="224" y="190" width="20" height="86" rx="10"/>
    <rect x="262" y="204" width="20" height="58" rx="10"/>
    <rect x="300" y="222" width="20" height="22" rx="10"/>
  </g>
</svg>

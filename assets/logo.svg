<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Meet AI logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1E4B"/>
      <stop offset="0.55" stop-color="#3A3FB8"/>
      <stop offset="1" stop-color="#6D5CF0"/>
    </linearGradient>
    <linearGradient id="spark" gradientUnits="userSpaceOnUse" x1="150" y1="190" x2="270" y2="310">
      <stop offset="0" stop-color="#5CF2FF"/>
      <stop offset="1" stop-color="#B58CFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7DEBFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7DEBFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  <rect x="2" y="2" width="508" height="508" rx="118" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="3"/>
  <!-- camera body and lens -->
  <rect x="82" y="156" width="250" height="200" rx="44" fill="#0F1130" fill-opacity="0.55" stroke="#FFFFFF" stroke-width="20"/>
  <path d="M352 232 L418 188 Q430 181 430 196 V316 Q430 331 418 324 L352 280 Z" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linejoin="round"/>
  <!-- AI spark: three connected nodes -->
  <circle cx="207" cy="256" r="95" fill="url(#glow)"/>
  <g stroke="url(#spark)" stroke-width="12" stroke-linecap="round" fill="none">
    <path d="M207 204 L160 294"/>
    <path d="M207 204 L254 294"/>
    <path d="M160 294 L254 294"/>
  </g>
  <g fill="url(#spark)">
    <circle cx="207" cy="204" r="24"/>
    <circle cx="160" cy="294" r="20"/>
    <circle cx="254" cy="294" r="20"/>
  </g>
  <circle cx="207" cy="204" r="9" fill="#FFFFFF" fill-opacity="0.9"/>
</svg>
